name: fluiver
description: Flutter SDK gap-fillers — non-scrolling Grid, TickerBuilder, Debounce/Throttle, LRUCache, DisposableBag, Object.let, DateTime/Iterable/Color extensions. Ships an LLM skill.
version: 4.1.0
homepage: https://mehmetesen.com
repository: https://github.com/esenmx/fluiver
issue_tracker: https://github.com/esenmx/fluiver/issues
documentation: https://pub.dev/documentation/fluiver/latest/

topics:
  - extensions
  - utilities
  - llm
  - widget
  - flutter

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  checks: ^0.3.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
